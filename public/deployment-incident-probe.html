<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow">
    <title>Teajia incident deployment probe</title>
  </head>
  <body>
    <pre id="status">running</pre>
    <script>
      (async () => {
        const status = document.getElementById('status');
        const token = localStorage.getItem('teajia_token') || sessionStorage.getItem('teajia_token');
        if (!token) {
          status.textContent = 'not-authenticated';
          return;
        }
        try {
          const response = await fetch('/api/incidents', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              signature: 'client:post:deployment-probe:none:forced-validation-1464b565',
              category: 'client',
              severity: 'low',
              route: '/deployment-incident-probe.html',
              method: 'POST',
              http_status: null,
              error_code: 'forced_validation',
              deployment: '1464b565',
              sample: { browser_online: navigator.onLine },
            }),
          });
          status.textContent = response.ok ? `recorded:${response.status}` : `failed:${response.status}`;
        } catch {
          status.textContent = 'request-failed';
        }
      })();
    </script>
  </body>
</html>
