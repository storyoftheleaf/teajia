name = "teajia-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Keep the *.workers.dev host alive alongside the custom domain. Adding a
# [[routes]] block makes wrangler disable workers.dev by default, which would
# break the live site (it still points at workers.dev until VITE_API_URL is
# switched). Both hosts must serve during the cutover.
workers_dev = true

# Custom domain for the API. The default *.workers.dev host is blocked in
# mainland China, so all writes (photo upload, transcription, compass sync)
# silently fail there. Serving the API from the teajia.com zone — which IS
# reachable in China, since the site loads — fixes that. `custom_domain = true`
# provisions the DNS record + TLS cert on `wrangler deploy`, provided the
# teajia.com zone lives on this Cloudflare account. The *.workers.dev host
# keeps working in parallel, so this is a safe, additive cutover.
[[routes]]
pattern = "api.teajia.com"
custom_domain = true

# Non-secret public config. Safe as [vars] — these are NOT secrets, so they
# don't trigger the shadowing problem described below.
#   OAUTH_REDIRECT_ORIGIN — host used to build the Google OAuth redirect_uri.
#   This must remain byte-for-byte identical to an Authorized redirect URI on
#   the Google Cloud OAuth client. Google currently has the workers.dev callback
#   registered; the browser returns to www.teajia.com after the Worker exchanges
#   the code. (Google sign-in itself is unavailable where Google is blocked, so
#   using the custom API domain here provides no mainland-China benefit.)
[vars]
OAUTH_REDIRECT_ORIGIN = "https://teajia-api.lightcodes.workers.dev"
WORDFORGE_ACCOUNT_ID = "acc_teajia_bali"

[ai]
binding = "AI"

[images]
binding = "IMAGES"

# Secrets (set via `wrangler secret put`, never committed):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  — Google OAuth (local dev reads them from worker/.dev.vars)
#   JWT_SECRET, ADMIN_PASSWORD_HASH         — auth
#   VERIFICATION_CODE_SECRET                — HMAC key for verification-code digests
#   SENDER_EMAIL, SENDER_NAME, RESEND_API_KEY — email (Resend)
# These must NOT be declared as [vars] — a [vars] entry would shadow the secret
# with an empty string on every deploy and break OAuth.

[[d1_databases]]
binding = "DB"
database_name = "teajia-db"
database_id = "2dbafe5c-10db-4ac6-9f17-4292b5beffc9"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "teajia-media"

[triggers]
crons = ["0 * * * *"]

# Edge rate limiter for the public, unauthenticated MCP (/mcp/public).
# Native Cloudflare Workers rate limiting — works on *.workers.dev (no zone /
# WAF rule needed). 60 requests per 10s window, keyed per client IP in code.
[[unsafe.bindings]]
name = "PUBLIC_MCP_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 10 }

# Edge rate limiter for auth endpoints (login / signup), keyed per client IP
# via CF-Connecting-IP in code (audit M1). The in-memory checkRateLimit() is a
# per-isolate fallback only — it resets on cold start and does not span
# isolates, so distributed brute-force slips past it. This durable limiter is
# used first when present. 10 attempts per 60s window.
[[unsafe.bindings]]
name = "LOGIN_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "VERIFY_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "JOIN_CODE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "PROVIDER_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RSVP_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "OAUTH_REGISTER_LIMITER"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "OAUTH_AUTHORIZE_LIMITER"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 30, period = 60 }
