name = "teajia-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Google OAuth — values set via `wrangler secret put` for production; see worker/.dev.vars for local dev
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
# JWT_SECRET and ADMIN_PASSWORD_HASH are set via `wrangler secret put` — never commit them here
# Email (Resend): set SENDER_EMAIL, SENDER_NAME, and RESEND_API_KEY via `wrangler secret put`

[[d1_databases]]
binding = "DB"
database_name = "teajia-db"
database_id = "2dbafe5c-10db-4ac6-9f17-4292b5beffc9"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "teajia-media"

[triggers]
crons = ["0 1 * * *"]
