name = "teajia-offline-fixtures"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = false

[dev]
ip = "127.0.0.1"
port = 8787

[vars]
SHARED_ALLOWANCE_REQUIRED = "false"

[[d1_databases]]
binding = "DB"
database_name = "teajia-offline-fixtures"
database_id = "57699612-eacc-438d-a18e-63afb6821497"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "teajia-offline-fixtures-media"

[[r2_buckets]]
binding = "ATLAS_BUCKET"
bucket_name = "teajia-offline-fixtures-private"

[[ratelimits]]
name = "PROVIDER_LIMITER"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AFTER_SIT_LIMITER"
namespace_id = "1012"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "RSVP_LIMITER"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INQUIRY_LIMITER"
namespace_id = "1009"
simple = { limit = 60, period = 60 }
