name: D1 account budget

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-d1-budget*'
      - '.github/workflows/d1-budget.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  pull_request:
    paths:
      - 'scripts/check-d1-budget*'
      - '.github/workflows/d1-budget.yml'

permissions:
  contents: read

concurrency:
  group: d1-budget-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test budget monitor
        run: node --test scripts/check-d1-budget.test.mjs
      # No secrets exposed to pull-request code. Analytics is independent of
      # D1 reads, so it can report even after the application quota is exhausted.
      - name: Read account usage
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DAILY_READ_BUDGET: ${{ vars.D1_DAILY_READ_BUDGET || '5000000' }}
          D1_DAILY_WRITE_BUDGET: ${{ vars.D1_DAILY_WRITE_BUDGET || '100000' }}
          D1_WARNING_FRACTION: '0.7'
          D1_CRITICAL_FRACTION: '0.9'
        run: node scripts/check-d1-budget.mjs
      - name: Preserve usage even when the threshold or metrics check fails
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-budget-${{ github.run_id }}
          path: outputs/d1-budget/
          if-no-files-found: error
          retention-days: 14
