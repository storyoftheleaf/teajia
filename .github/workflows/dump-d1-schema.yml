name: Dump Remote D1 Schema
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dump remote D1 schema via SQL
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== ALL TABLES ==="
          npx wrangler d1 execute teajia-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" 2>/dev/null
          echo "=== ALL TABLE DDL ==="
          npx wrangler d1 execute teajia-db --remote --json --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND sql IS NOT NULL ORDER BY name" 2>/dev/null
          echo "=== ALL INDEXES ==="
          npx wrangler d1 execute teajia-db --remote --json --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND sql IS NOT NULL AND name NOT LIKE 'sqlite_%' ORDER BY name" 2>/dev/null