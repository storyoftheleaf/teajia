name: Dump Remote D1 Schema
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dump remote D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export teajia-db --remote --no-data --output=/tmp/live-schema.sql 2>&1 | tail -5
          echo "=== LIVE SCHEMA DUMP (schema only) ==="
          cat /tmp/live-schema.sql