name: Dump Remote D1 Schema
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dump live schema to artifact
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "-- LIVE SCHEMA DUMP --" > /tmp/live.sql
          npx wrangler d1 execute teajia-db --remote --command "SELECT sql FROM sqlite_master WHERE sql IS NOT NULL ORDER BY name" 2>/dev/null | sed 's/^[[:space:]]*//' >> /tmp/live.sql
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-schema
          path: /tmp/live.sql