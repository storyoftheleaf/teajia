name: D1 Baseline Probe (fast)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe chunks against remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'EOF'
          import subprocess
          sql = open('migrations/0000_initial_schema.sql').read()
          stmts = [s.strip() for s in sql.split(';') if s.strip() and not s.strip().startswith('--') and not s.strip().startswith('\n--')]
          # chunk into ~10 groups
          chunk = 12
          groups = [stmts[i:i+chunk] for i in range(0, len(stmts), chunk)]
          print(f"TOTAL={len(stmts)} GROUPS={len(groups)}")
          for gi, g in enumerate(groups):
              combined = "\n".join(s + ";" for s in g)
              try:
                  r = subprocess.run(
                      ["npx","wrangler","d1","execute","teajia-db","--remote","--command",combined[:8000]],
                      capture_output=True, text=True, timeout=25)
                  code = r.returncode
                  sig = (r.stderr or r.stdout or "").strip()[-150:]
                  print(f"G{gi}: rc={code} {sig}")
                  if code != 0:
                      # print individual statement heads in this group
                      for s in g:
                          print(f"   in G{gi}: {s[:90]}")
                  else:
                      pass
              except subprocess.TimeoutExpired:
                  print(f"G{gi}: TIMEOUT")
          print("PROBE DONE")
          EOF