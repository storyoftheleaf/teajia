name: D1 Baseline Probe (full error)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find exact failing statement
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'EOF'
          import subprocess
          sql = open('migrations/0000_initial_schema.sql').read()
          stmts = [s.strip() for s in sql.split(';') if s.strip() and not s.strip().startswith('--')]
          print(f"TOTAL single statements: {len(stmts)}")
          # Run each statement individually (they are all IF NOT EXISTS => no-op on live; safe)
          for i, s in enumerate(stmts):
              try:
                  r = subprocess.run(
                      ["npx","wrangler","d1","execute","teajia-db","--remote","--command",s[:4000]],
                      capture_output=True, text=True, timeout=30)
                  if r.returncode != 0:
                      # capture FULL stderr
                      print(f"FAIL[{i+1}] " + s.replace(chr(10),' ')[:140])
                      print("---ERR_START---")
                      print((r.stderr or r.stdout)[-1500:])
                      print("---ERR_END---")
                      break  # first failure is enough
              except subprocess.TimeoutExpired:
                  print(f"TIMEOUT[{i+1}] " + s.replace(chr(10),' ')[:140])
                  break
          print("PROBE DONE")
          EOF