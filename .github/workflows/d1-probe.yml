name: D1 Baseline Probe (file-based)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find real failing statement (full SQL via file)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'EOF'
          import subprocess, os
          sql = open('migrations/0000_initial_schema.sql').read()
          # split on ';\n' boundaries (statement terminator followed by newline)
          import re
          parts = re.split(r';\s*\n\s*', sql)
          stmts = [p.strip().strip(';') for p in parts if p.strip() and not p.strip().startswith('--')]
          print(f"TOTAL statements: {len(stmts)}")
          for i, s in enumerate(stmts):
              # write full statement to temp file (no truncation)
              fn = f"/tmp/stmt{i}.sql"
              open(fn,'w').write(s + ";\n")
              try:
                  r = subprocess.run(
                      ["npx","wrangler","d1","execute","teajia-db","--remote","--file",fn],
                      capture_output=True, text=True, timeout=30)
                  if r.returncode != 0:
                      out=(r.stdout or "")+(r.stderr or "")
                      print(f"FAIL[{i+1}] " + s.replace(chr(10),' ')[:100])
                      print("---ERR_START---")
                      print(out[-1200:])
                      print("---ERR_END---")
                      break
              except subprocess.TimeoutExpired:
                  print(f"TIMEOUT[{i+1}] " + s[:100]); break
          print("PROBE DONE")
          EOF