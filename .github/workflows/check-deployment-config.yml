name: Check deployment config

# This is early repository feedback, not the gate for Cloudflare Git deploys.
# The authoritative gate runs inside `npm run build` on Cloudflare Pages, where
# WORKER_ORIGIN is the same environment binding received by Pages Functions.
on:
  pull_request:
    paths:
      - 'functions/**'
      - 'scripts/check-required-deployment-config.mjs'
      - 'scripts/check-required-deployment-config.test.mjs'
      - 'package.json'
      - '.github/workflows/check-deployment-config.yml'
      - '.github/workflows/deploy-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'scripts/check-required-deployment-config.mjs'
      - 'scripts/check-required-deployment-config.test.mjs'
      - 'package.json'
      - '.github/workflows/check-deployment-config.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-variable:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate WORKER_ORIGIN repository variable
        run: npm run check:deploy-config

      - name: Deployment configuration tests
        run: node --test scripts/check-required-deployment-config.test.mjs
