name: Playwright

# Until 2026-09-09 this workflow ran two of 48 browser specs and nothing on a
# push to main ran tsc, the color lint or the production build. A syntax
# error unreachable from those two specs landed green: two JSX comments
# placed inside an element's attribute list in AddProductModal.tsx broke
# tsc, vite build and every Cloudflare Pages build for two days (six
# production deploys failed in a row), because the dev server transpiles a
# file only when a visited route imports it, and neither of the two mobile
# specs opens the admin route that does. Fixed in 2f1b7ea3; this file is
# the gate that would have caught it.
#
# `checks` is that gate: tsc, the color lint, the production build and the
# worker test suite, on every push and pull request to main. `mobile` and
# `e2e` cover browser behavior; `china-scan`, `platform-hardening` and
# `recovery` wire in the three suites that had no CI lane at all.
#
# Pull requests run the full browser suite only for the spec files the PR
# changed (`e2e-changed`, Playwright's --only-changed follows each spec's
# imports, so a change to tests/fixtures.ts still reaches every spec); main
# runs everything (`e2e`) after every merge. Adrian, 2026-09-29: a one-line
# fix waited 30 minutes on 640 browser tests it could not affect. The trade
# is that a regression in a page no changed spec visits surfaces on main,
# minutes after merge, instead of on the PR. `checks` (tsc, the build, the
# unit and worker suites) and `mobile` still run in full on every PR, which
# is the class of check the 2026-09-09 outage needed.

on:
  schedule:
    # Nightly slot for the two advisory lanes (known-failing, recovery).
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'
      - 'ops/**'
      - '.claude/**'
  push:
    branches: [main]
    # Prose never changes what the suite proves; every skipped run is minutes
    # kept for a run that matters (the account ran out in September 2026).
    #
    # `ops/**` is the incident bot's own export, written to main once a day,
    # and `.claude/**` is agent configuration. Neither is read by the build or
    # by any spec, and 42 of September's 225 pushes to main changed nothing but
    # prose of this kind.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'
      - 'ops/**'
      - '.claude/**'

# A run on main is never cancelled once it has started. Main takes a push
# every few minutes and the sharded e2e takes longer than that, so with
# cancel-in-progress on main each run was cut down by the next push: 51 of
# the last 100 main runs ended cancelled (measured 2026-09-28), no verdict.
# Now the running one finishes and GitHub keeps ONE waiting run per group; a
# newer push replaces the waiting run before it starts, so the latest commit
# is always tested next and the skipped commits cost no minutes. Pull
# requests still cancel, because only a PR's newest commit matters.
concurrency:
  group: playwright-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Debt list, dated 2026-09-09. The first run of the full suite (this same
  # workflow's first version) surfaced six tests that fail deterministically
  # on main, independent of any change here: they were simply never run in
  # CI before this file existed. `e2e` excludes them with --grep-invert so a
  # real regression is not buried in known noise; `known-failing` runs the
  # same six with --grep and continue-on-error so they stay visible on every
  # run instead of going quiet. The fix is to repair the test or the page it
  # exercises, then delete that test's title from this regex in the same
  # commit. Titles, not file:line, because a line number drifts and a title
  # does not.
  KNOWN_FAILING_E2E: "a private section note appears publicly only after edited promotion"

jobs:
  # Skips the suite when a push to main is a PR merge whose tree is byte-for-byte
  # the tree this workflow already passed on the PR head (the case whenever the
  # PR was up to date with main). Re-running it proved nothing and cost a full
  # run per merge: in September 2026 that doubling took the account past its
  # free Actions minutes. A direct push, a merge whose tree differs from the PR
  # head, or a head with no green run all still run everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The default token cannot list runs; without this the lookup silently
    # returns nothing and the gate never skips (seen on the first merge).
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true; why="not a push to main"
          # Pull requests now run only the browser specs they changed
          # (e2e-changed), so a green PR head is not a full-suite verdict and
          # a merge runs everything unless the merged head already has a green
          # run that was not a pull_request run (a push or a manual dispatch,
          # both of which run the full e2e job).
          if [ "${{ github.event_name }}" = push ]; then
            why="direct push"
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ge 3 ]; then
              head="$(git rev-parse HEAD^2)"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${head}^{tree}")" ]; then
                # workflow_ref is owner/repo/.github/workflows/<file>@refs/heads/<branch>
                wf="${{ github.workflow_ref }}"; wf="${wf%%@*}"; wf="${wf##*/}"
                green="$(gh run list --workflow="$wf" --commit="$head" --json conclusion,event --jq '[.[] | select(.conclusion=="success" and .event!="pull_request")] | length' 2>&1 || true)"
                case "$green" in ''|*[!0-9]*) echo "gate: run lookup failed: $green"; green=0;; esac
                if [ "${green:-0}" -gt 0 ]; then run=false; why="merge of $head, same tree, already green"; else why="merge of $head, same tree, but no green run on it"; fi
              else
                why="merge whose tree differs from the PR head"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate: run=$run ($why)"

  budget:
    # What the month has cost so far, said out loud.
    #
    # Every push to main is one Cloudflare Pages production build as well as a
    # run here, the free plan stops building after 500 of them in a month, and
    # the 501st does not announce itself — it simply does not deploy. September
    # 2026 took 225 separate pushes to main and produced 520 runs, one push per
    # commit and a single change landing over three to six pushes minutes
    # apart; nothing was looping, the shape of the work was the spend.
    #
    # So this job turns the run RED once the month is four fifths spent or on
    # pace to pass the limit, which is the repo's own rule about stale exchange
    # rates applied to money of a different kind: a warning on screen, not just
    # in a log. It gates nothing and needs no install — an over-budget month
    # must never be the reason a fix cannot land. The figure and the decision
    # live in scripts/ci-spend-budget.mjs; this job only calls it.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: This month's CI spend
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ci:spend-budget

  checks:
    # The lane the outage needed. Nothing here touches a browser: tsc sees
    # every file whether or not a route imports it, the build is the same
    # bundle Cloudflare Pages produces, and the worker suite is the API's
    # own contract.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Worker types (ratcheted)
        run: npm run lint:worker-types

      # Moved here from check-deployment-config.yml, which used to be a second
      # workflow run per push to main for two commands that take seconds. Same
      # two commands, same push, one run. That workflow still answers pull
      # requests, where it reports on its own without costing a Pages build.
      - name: Required deployment configuration
        env:
          WORKER_ORIGIN: ${{ vars.WORKER_ORIGIN }}
        run: npm run check:deploy-config

      - name: Deployment configuration tests
        run: node --test scripts/check-required-deployment-config.test.mjs

      - name: Source unit tests
        run: npm run test:src

      - name: Color rules
        run: npm run lint:colors

      - name: Build
        run: npm run build

      - name: Worker tests
        run: npm run test:worker

  mobile:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile regression suite
        run: npm run test:mobile

  e2e:
    # Every spec the default config can run. Two projects, not three:
    # inventory-scroll.spec.ts names "Desktop Chrome" and "Mobile Chrome"
    # explicitly and skips the plain "chromium" project as redundant with
    # them (its own comment says so), so chromium adds runtime without
    # adding coverage. Two specs read dist/ directly (china-reachability,
    # admin-chunk-failure-production), so the build runs before Playwright.
    # tea-reference-preview.spec.ts and tea-reference-revision-workflow.spec.ts
    # are left out: playwright.config.ts already excludes them via
    # testIgnore because they need the dev server started under
    # `--mode tea-reference-preview`, and the preview spec also needs a
    # private, non-CI TEA_REFERENCE_HANDOFF_PATH file that does not exist
    # in this environment. They run by hand via test:tea-reference-browser
    # and test:tea-reference-revision-browser.
    #
    # Excludes the six titles in KNOWN_FAILING_E2E (see the workflow-level
    # env comment above): everything else in every spec here still runs and
    # blocks the merge, including the rest of inventory-scroll.spec.ts.
    #
    # Sharded four ways. Measured 2026-09-09 under the same CI settings this
    # job uses (playwright.config.ts forces workers to 1 and retries to 2
    # when CI is set): the playwright command alone took 35.0 minutes on an
    # M-series Mac for 640 passed / 18 skipped, before npm ci, browser
    # install and the 34 s build. This repo is private, so ubuntu-latest is
    # the 2 vCPU tier and a single unsharded job would run well past an
    # hour, over the old 30-minute cap. Arithmetic for timeout-minutes: 35
    # minutes divided across 4 shards is 8.75 minutes of playwright time per
    # shard on the Mac; doubled for the slower 2 vCPU tier is 17.5 minutes;
    # plus npm ci, chromium install and the build (roughly 3 to 5 minutes
    # combined on this tier) rounds to about 22 minutes; 25 leaves margin
    # for CI variance without approaching the old unsharded runtime. Each
    # shard still applies KNOWN_FAILING_E2E, since --shard partitions the
    # already-filtered test list. workers is left at the config's own
    # default (1 in CI): each matrix shard is its own runner with its own
    # webServer process (playwright.config.ts starts one dev server per
    # job), so there is no server shared between shards for a raised
    # worker count to contend over, and this stays out of
    # playwright.config.ts (not this item's file) either way.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule' && github.event_name != 'pull_request'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Full browser suite (shard ${{ matrix.shard }}/4)
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --grep-invert "$KNOWN_FAILING_E2E" --shard=${{ matrix.shard }}/4 --reporter=list

  e2e-changed:
    # Pull requests only: the specs this PR changed, against its base branch.
    # A PR that changes no spec (or no file a spec imports) runs none here and
    # passes; `checks` and `mobile` above still ran in full. Same projects,
    # same KNOWN_FAILING_E2E exclusion and the same build as `e2e`, so a spec
    # that passes here passes there. Full history is fetched because
    # --only-changed diffs against the base ref.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser specs this PR changed
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --grep-invert "$KNOWN_FAILING_E2E" --only-changed="origin/${{ github.base_ref }}" --pass-with-no-tests --reporter=list

  known-failing:
    # The same six tests named in KNOWN_FAILING_E2E, on their own, with
    # continue-on-error so this job never blocks a merge but still shows a
    # visible pass or fail on every run. Watch this job: the day it turns
    # green is the day someone can delete a title from the regex above.
    runs-on: ubuntu-latest
    needs: gate
    # Nightly and by hand only: this lane never blocks a merge, so running it
    # on every push spent minutes (8 a run) proving nothing new.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Known-failing suite
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --grep "$KNOWN_FAILING_E2E" --reporter=list

  china-scan:
    # node:test only, no browser, no server: safe and cheap to run on every
    # push and pull request.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: China dependency scan
        run: npm run test:china-scan

  platform-hardening:
    # Also node:test only, no browser: workflow-pinning, package.json
    # wiring and a handful of dead-code checks, none of them needing a
    # built bundle.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Platform hardening checks
        run: npm run test:platform-hardening

  recovery:
    # admin-chunk-failure-production.spec.ts again, this time against a
    # real production build served by `vite preview` (playwright.recovery
    # .config.ts's own webServer runs `npm run build && npm run preview`),
    # so the built chunk hashes and the self-destroying service worker are
    # exercised as they actually ship, not as the dev server approximates
    # them in the `e2e` job above.
    #
    # That webServer command has a 120-second budget for the build plus
    # preview startup, timed out of a bare checkout on whatever tier the
    # runner lands on. The checks job's own build step measured 34 s, but
    # that was on the faster hardware this account has seen; a cold build
    # on the 2 vCPU tier this private repo actually gets could run close to
    # or past 120 s before preview even starts. A Build step below runs
    # `npm run build` once before Playwright starts, under this job's own
    # 15-minute budget rather than the webServer's 120-second one, so npm's
    # dependency pre-bundle and the OS file cache are warm by the time the
    # webServer command repeats `npm run build`: playwright.recovery
    # .config.ts is left untouched, its command still rebuilds, but that
    # second build is reading files the runner already pulled into cache
    # seconds earlier instead of racing cold. If a cold-vs-warm CI run
    # shows this still isn't enough margin, raise the config's own
    # timeout with the measurement in a comment there.
    runs-on: ubuntu-latest
    needs: gate
    # Nightly and by hand only: this lane never blocks a merge, so running it
    # on every push spent minutes (8 a run) proving nothing new.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Production recovery suite
        run: npm run test:recovery
