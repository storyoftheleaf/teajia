name: Playwright

# Until 2026-09-09 this workflow ran two of 48 browser specs and nothing on a
# push to main ran tsc, the color lint or the production build. A syntax
# error unreachable from those two specs landed green: two JSX comments
# placed inside an element's attribute list in AddProductModal.tsx broke
# tsc, vite build and every Cloudflare Pages build for two days (six
# production deploys failed in a row), because the dev server transpiles a
# file only when a visited route imports it, and neither of the two mobile
# specs opens the admin route that does. Fixed in 2f1b7ea3; this file is
# the gate that would have caught it.
#
# `checks` is that gate: tsc, the color lint, the production build and the
# worker test suite, on every push and pull request to main. Since
# 2026-11-27 it is split: `checks-static` and four `worker-tests` shards run
# side by side, and `checks` passes only when all of them did. `mobile` and
# `e2e` cover browser behavior; `china-scan`, `platform-hardening` and
# `recovery` wire in the three suites that had no CI lane at all.
#
# Pull requests run the full browser suite only for the spec files the PR
# changed (`e2e-changed`, Playwright's --only-changed follows each spec's
# imports, so a change to tests/fixtures.ts still reaches every spec); main
# runs everything (`e2e`) after every merge. Adrian, 2026-09-29: a one-line
# fix waited 30 minutes on 640 browser tests it could not affect. The trade
# is that a regression in a page no changed spec visits surfaces on main,
# minutes after merge, instead of on the PR. `checks` (tsc, the build, the
# unit and worker suites) and `mobile` still run in full on every PR, which
# is the class of check the 2026-09-09 outage needed.

on:
  schedule:
    # Nightly slot for the advisory recovery lane.
    - cron: '30 2 * * *'
  workflow_dispatch:
  # Pull requests always start this workflow, prose-only ones too: `checks`,
  # `mobile` and `e2e-changed` are required on main, and a required check
  # that never starts holds the PR forever. The gate below skips every lane
  # of a prose-only PR in seconds instead, and a skipped required check
  # counts as passed.
  pull_request:
  push:
    branches: [main]
    # Prose never changes what the suite proves; every skipped run is minutes
    # kept for a run that matters (the account ran out in September 2026).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'todo/**'

# A run on main is never cancelled once it has started. Main takes a push
# every few minutes and the sharded e2e takes longer than that, so with
# cancel-in-progress on main each run was cut down by the next push: 51 of
# the last 100 main runs ended cancelled (measured 2026-09-28), no verdict.
# Now the running one finishes and GitHub keeps ONE waiting run per group; a
# newer push replaces the waiting run before it starts, so the latest commit
# is always tested next and the skipped commits cost no minutes. Pull
# requests still cancel, because only a PR's newest commit matters.
concurrency:
  group: playwright-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the suite when a push to main is a PR merge whose tree is byte-for-byte
  # the tree this workflow already passed on the PR head (the case whenever the
  # PR was up to date with main). Re-running it proved nothing and cost a full
  # run per merge: in September 2026 that doubling took the account past its
  # free Actions minutes. A direct push, a merge whose tree differs from the PR
  # head, or a head with no green run all still run everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The default token cannot list runs; without this the lookup silently
    # returns nothing and the gate never skips (seen on the first merge).
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true; why="not a push to main"
          # Pull requests now run only the browser specs they changed
          # (e2e-changed), so a green PR head is not a full-suite verdict and
          # a merge runs everything unless the merged head already has a green
          # run that was not a pull_request run (a push or a manual dispatch,
          # both of which run the full e2e job).
          if [ "${{ github.event_name }}" = pull_request ]; then
            why="pull request"
            # A pull_request checkout is GitHub's merge of the PR into its
            # base, so the first parent is the base and the diff is the PR.
            files="$(git diff --name-only HEAD^1 HEAD)"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^([^/]*\.md|docs/.*|todo/.*)$'; then
              run=false; why="pull request changes only prose (*.md, docs/, todo/)"
            fi
          fi
          if [ "${{ github.event_name }}" = push ]; then
            why="direct push"
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ge 3 ]; then
              head="$(git rev-parse HEAD^2)"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${head}^{tree}")" ]; then
                # workflow_ref is owner/repo/.github/workflows/<file>@refs/heads/<branch>
                wf="${{ github.workflow_ref }}"; wf="${wf%%@*}"; wf="${wf##*/}"
                green="$(gh run list --workflow="$wf" --commit="$head" --json conclusion,event --jq '[.[] | select(.conclusion=="success" and .event!="pull_request")] | length' 2>&1 || true)"
                case "$green" in ''|*[!0-9]*) echo "gate: run lookup failed: $green"; green=0;; esac
                if [ "${green:-0}" -gt 0 ]; then run=false; why="merge of $head, same tree, already green"; else why="merge of $head, same tree, but no green run on it"; fi
              else
                why="merge whose tree differs from the PR head"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate: run=$run ($why)"
  checks-static:
    # The lane the outage needed. Nothing here touches a browser: tsc sees
    # every file whether or not a route imports it, and the build is the same
    # bundle Cloudflare Pages produces. The worker suite, the API's own
    # contract, runs beside this in `worker-tests`, and `checks` below joins
    # the two into the one verdict the branch rule and the deploy read.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 15
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Worker types (ratcheted)
        run: npm run lint:worker-types

      - name: Source unit tests
        run: npm run test:src

      - name: Read build confidentiality
        run: npm run test:read-delivery

      - name: Color rules
        run: npm run lint:colors

  build:
    # The production build, beside the static lane instead of after it: it
    # was the last minute of a 3 minute serial job (2026-11-27). Same command,
    # same bundle Cloudflare Pages produces; `checks` still requires it.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  worker-tests:
    # The worker suite took 9 of a PR's 12 minutes run in one piece, and
    # crossed 15 minutes on slow runners (2026-11-27). Split four ways a shard
    # still took 3.5 minutes and was the long pole with `mobile`; six ways it
    # is about 2.5. Every test still runs: vitest's --shard partitions the
    # whole file list, and `checks` fails unless every shard passed.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Worker tests (shard ${{ matrix.shard }}/6)
        run: npm run test:worker -- --shard=${{ matrix.shard }}/6

  checks:
    # One stable required check. It passes only when the static lane and
    # every worker shard passed, and then records the exact tree it proved
    # as an artifact named worker-tests-passed-<tree>. deploy-worker.yml
    # looks for that name and skips rerunning the worker suite for a tree
    # already proven here, which is what a merge of an up-to-date PR is.
    runs-on: ubuntu-latest
    needs: [gate, checks-static, build, worker-tests]
    if: always() && needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 3
    steps:
      - name: Require the static lane, the build and every worker shard
        env:
          STATIC_RESULT: ${{ needs.checks-static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WORKER_RESULT: ${{ needs.worker-tests.result }}
        run: test "$STATIC_RESULT" = success && test "$BUILD_RESULT" = success && test "$WORKER_RESULT" = success

      - name: Record the proven tree
        env:
          TREE: ${{ needs.checks-static.outputs.tree }}
        run: |
          set -euo pipefail
          echo "$TREE" | grep -Eq '^[0-9a-f]{40}$'
          mkdir -p "$RUNNER_TEMP/proof"
          printf '{"tree":"%s","sha":"%s","run":%s}\n' "$TREE" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/proof/worker-tests-passed.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-tests-passed-${{ needs.checks-static.outputs.tree }}
          path: ${{ runner.temp }}/proof/worker-tests-passed.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  mobile-lane:
    # `mobile` ran the mobile browser suite and then the admin journeys one
    # after the other, about 5 minutes, the longest job on every PR
    # (2026-11-27). Now the browser suite is split in two (the config is
    # fullyParallel, so --shard splits by test) and the admin journeys, which
    # are vitest (they launch Chromium themselves), run beside them. `mobile` below
    # joins the three into the one check it always was.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [mobile-1, mobile-2, admin-behavior]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The admin journeys are vitest, but they launch Chromium themselves
      # (src/admin/components/*.behavior.test.ts), so every lane installs it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile regression suite (half ${{ matrix.lane == 'mobile-1' && '1' || '2' }} of 2)
        if: matrix.lane != 'admin-behavior'
        run: npm run test:mobile -- --shard=${{ matrix.lane == 'mobile-1' && '1' || '2' }}/2

      - name: Admin component browser journeys
        if: matrix.lane == 'admin-behavior'
        run: npm run test:admin-behavior

  mobile:
    # The one stable check name, as before the split.
    runs-on: ubuntu-latest
    needs: [gate, mobile-lane]
    if: always() && needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 3
    steps:
      - name: Require both mobile halves and the admin journeys
        env:
          LANES_RESULT: ${{ needs.mobile-lane.result }}
        run: test "$LANES_RESULT" = success

  e2e:
    # Every spec the default config can run. Two projects, not three:
    # inventory-scroll.spec.ts names "Desktop Chrome" and "Mobile Chrome"
    # explicitly and skips the plain "chromium" project as redundant with
    # them (its own comment says so), so chromium adds runtime without
    # adding coverage. Two specs read dist/ directly (china-reachability,
    # admin-chunk-failure-production), so the build runs before Playwright.
    # tea-reference-preview.spec.ts and tea-reference-revision-workflow.spec.ts
    # are left out: playwright.config.ts already excludes them via
    # testIgnore because they need the dev server started under
    # `--mode tea-reference-preview`, and the preview spec also needs a
    # private, non-CI TEA_REFERENCE_HANDOFF_PATH file that does not exist
    # in this environment. They run by hand via test:tea-reference-browser
    # and test:tea-reference-revision-browser.
    #
    # Sharded four ways. Measured 2026-09-09 under the same CI settings this
    # job uses (playwright.config.ts forces workers to 1 and retries to 2
    # when CI is set): the playwright command alone took 35.0 minutes on an
    # M-series Mac for 640 passed / 18 skipped, before npm ci, browser
    # install and the 34 s build. This repo is private, so ubuntu-latest is
    # the 2 vCPU tier and a single unsharded job would run well past an
    # hour, over the old 30-minute cap. Arithmetic for timeout-minutes: 35
    # minutes divided across 4 shards is 8.75 minutes of playwright time per
    # shard on the Mac; doubled for the slower 2 vCPU tier is 17.5 minutes;
    # plus npm ci, chromium install and the build (roughly 3 to 5 minutes
    # combined on this tier) rounds to about 22 minutes; 25 leaves margin
    # for CI variance without approaching the old unsharded runtime. Each
    # shard partitions the full test list. workers is left at the config's own
    # default (1 in CI): each matrix shard is its own runner with its own
    # webServer process (playwright.config.ts starts one dev server per
    # job), so there is no server shared between shards for a raised
    # worker count to contend over, and this stays out of
    # playwright.config.ts (not this item's file) either way.
    #
    # 25 became 35 on 2026-10-10, measured: the suite grew (Curate v2 alone
    # added about 160 browser tests) and shard 3 was cut off at the 25-minute
    # cap on every main run that day, the last at test 275 of 286, so main
    # could not go green at all. A cancelled shard spends its whole 25
    # minutes and proves nothing, so a cap the suite actually fits in costs
    # fewer runner minutes than one it overruns. Rebalance or add a shard if
    # a shard nears 35.
    #
    # 4 became 6 on 2026-10-31, measured: with every shard green but for one
    # screenshot path, shard 2 still took 32 of its 35 minutes and shard 4
    # was cut off at the cap. Six shards put each near 20.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule' && github.event_name != 'pull_request'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Full browser suite (shard ${{ matrix.shard }}/6)
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --shard=${{ matrix.shard }}/6 --reporter=list

  e2e-changed-select:
    # Pull requests only: which browser specs this PR changed, against its
    # base branch (Playwright's --only-changed follows each spec's imports).
    # Most PRs change none. Asking once here, on one runner, instead of on
    # six shards that each then ran nothing, keeps the account's concurrent
    # job limit for the lanes that do work: on 2026-11-27 jobs queued one to
    # two and a half minutes for a free runner while six idle shards held
    # them. Listing needs neither the browser nor the dev server.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 10
    outputs:
      total: ${{ steps.select.outputs.total }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: select
        name: Which specs this PR changed
        run: |
          set -euo pipefail
          out="$(npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --only-changed="origin/${{ github.base_ref }}" --pass-with-no-tests --list)"
          printf '%s\n' "$out" | tail -n 40
          total="$(printf '%s\n' "$out" | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -n1)"
          case "$total" in ''|*[!0-9]*) echo "could not read the test count; running the shards"; total=1;; esac
          echo "total=$total" >> "$GITHUB_OUTPUT"

  e2e-changed-shard:
    # The selected specs, split six ways as on main, so a shared fixture that
    # selects every spec does not time out one serial runner. Same projects,
    # same build as `e2e`, so a spec that passes here passes there.
    runs-on: ubuntu-latest
    needs: [gate, e2e-changed-select]
    if: needs.gate.outputs.run == 'true' && github.event_name == 'pull_request' && needs.e2e-changed-select.outputs.total != '0'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A small selection leaves some shards with no test; those skip the
      # browser install and the build.
      - id: select
        name: Which specs this shard runs
        run: |
          set -euo pipefail
          out="$(npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --only-changed="origin/${{ github.base_ref }}" --pass-with-no-tests --shard=${{ matrix.shard }}/6 --list)"
          printf '%s\n' "$out" | tail -n 20
          total="$(printf '%s\n' "$out" | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -n1)"
          case "$total" in ''|*[!0-9]*) echo "could not read the test count; running the shard"; total=1;; esac
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        if: steps.select.outputs.total != '0'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.select.outputs.total != '0'
        run: npm run build

      - name: Browser specs this PR changed
        if: steps.select.outputs.total != '0'
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome" --only-changed="origin/${{ github.base_ref }}" --pass-with-no-tests --shard=${{ matrix.shard }}/6 --reporter=list

  e2e-changed:
    # Keep one stable required check. It passes when the selection ran and
    # either chose nothing (the shards skip) or every shard passed.
    runs-on: ubuntu-latest
    needs: [gate, e2e-changed-select, e2e-changed-shard]
    if: always() && needs.gate.outputs.run == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 3
    steps:
      - name: Require the selection and every changed-spec shard
        env:
          SELECT_RESULT: ${{ needs.e2e-changed-select.result }}
          TOTAL: ${{ needs.e2e-changed-select.outputs.total }}
          SHARDS_RESULT: ${{ needs.e2e-changed-shard.result }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$TOTAL" = 0 ]; then test "$SHARDS_RESULT" = skipped; else test "$SHARDS_RESULT" = success; fi

  china-scan:
    # node:test only, no browser, no server: safe and cheap to run on every
    # push and pull request.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: China dependency scan
        run: npm run test:china-scan

  platform-hardening:
    # Also node:test only, no browser: workflow-pinning, package.json
    # wiring and a handful of dead-code checks, none of them needing a
    # built bundle.
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Platform hardening checks
        run: npm run test:platform-hardening

  recovery:
    # admin-chunk-failure-production.spec.ts again, this time against a
    # real production build served by `vite preview` (playwright.recovery
    # .config.ts's own webServer runs `npm run build && npm run preview`),
    # so the built chunk hashes and the self-destroying service worker are
    # exercised as they actually ship, not as the dev server approximates
    # them in the `e2e` job above.
    #
    # That webServer command has a 120-second budget for the build plus
    # preview startup, timed out of a bare checkout on whatever tier the
    # runner lands on. The checks job's own build step measured 34 s, but
    # that was on the faster hardware this account has seen; a cold build
    # on the 2 vCPU tier this private repo actually gets could run close to
    # or past 120 s before preview even starts. A Build step below runs
    # `npm run build` once before Playwright starts, under this job's own
    # 15-minute budget rather than the webServer's 120-second one, so npm's
    # dependency pre-bundle and the OS file cache are warm by the time the
    # webServer command repeats `npm run build`: playwright.recovery
    # .config.ts is left untouched, its command still rebuilds, but that
    # second build is reading files the runner already pulled into cache
    # seconds earlier instead of racing cold. If a cold-vs-warm CI run
    # shows this still isn't enough margin, raise the config's own
    # timeout with the measurement in a comment there.
    runs-on: ubuntu-latest
    needs: gate
    # Nightly and by hand only: this lane never blocks a merge, so running it
    # on every push spent minutes (8 a run) proving nothing new.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Production recovery suite
        run: npm run test:recovery
