name: Deploy worker

# This deploys the worker (the API at teajia-api.lightcodes.workers.dev) on
# every push that touches worker/**, plus on demand from the Actions tab.
# The frontend is handled separately by deploy-frontend.yml — it does NOT
# auto-deploy from Pages git (that was a wrong assumption that left
# production stale; see that workflow's header).
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — Edit Workers permission, scoped to the account
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns teajia-api

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  # Lets you trigger a deploy manually from any branch (Actions tab → Run workflow).
  # Useful when a fix has landed on a feature branch and you want it live
  # before the branch is merged to main.
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # vitest lives in the root package.json (npm run test:worker runs
      # worker/tests). A failing auth/fulfillment test blocks the deploy.
      - name: Install root dependencies
        run: npm ci

      - name: Worker tests
        run: npm run test:worker

      # ── One-off tracker reconcile for 097 (safe to remove after it has run) ──
      # 097's four customer columns were applied to the remote DB out-of-band
      # on 2026-06-29, so `d1 migrations apply` has failed with "duplicate
      # column name: business_card_photo" on EVERY deploy since — which means
      # the deploy step below never ran and the production worker went stale.
      # These steps make the columns idempotent (each ALTER tolerated
      # individually — it only fails when the column already exists) and then
      # mark 097 as applied in the tracker so the strict step below stops
      # tripping on it. The strict no-continue-on-error policy still guards
      # every migration from 098 onward.
      - name: Reconcile 097 — business_card_photo
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute teajia-db --remote --command "ALTER TABLE customers ADD COLUMN business_card_photo TEXT"
      - name: Reconcile 097 — storefront_photo
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute teajia-db --remote --command "ALTER TABLE customers ADD COLUMN storefront_photo TEXT"
      - name: Reconcile 097 — latitude
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute teajia-db --remote --command "ALTER TABLE customers ADD COLUMN latitude REAL"
      - name: Reconcile 097 — longitude
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute teajia-db --remote --command "ALTER TABLE customers ADD COLUMN longitude REAL"
      - name: Mark 097 as applied in the migrations tracker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute teajia-db --remote --command "INSERT INTO d1_migrations (name) SELECT '097_vendor_photos_location.sql' WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name = '097_vendor_photos_location.sql')"

      # Migrations apply on every worker deploy. This step must NOT swallow
      # failures: a silent `continue-on-error` is what let 076 + 080 drift out
      # of prod undetected (the d1_migrations tracker fell out of sync while the
      # deploy reported success). Tracker was reconciled 2026-06-01; from here a
      # failed migration fails the deploy loudly so drift can't recur.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply teajia-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
