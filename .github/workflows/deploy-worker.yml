name: Deploy worker

# This deploys the worker (the API at teajia-api.lightcodes.workers.dev) on
# every push that touches worker/**, plus on demand from the Actions tab.
# The frontend is handled separately by deploy-frontend.yml — it does NOT
# auto-deploy from Pages git (that was a wrong assumption that left
# production stale; see that workflow's header).
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — Edit Workers permission, scoped to the account
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns teajia-api
#
# 2026-08-19: CLOUDFLARE_API_TOKEN went missing around Aug 8 and every deploy
# from then until Aug 11 failed at the wrangler step with "it's necessary to
# set a CLOUDFLARE_API_TOKEN environment variable" (tests all green, deploy
# never reached Cloudflare). If that error ever reappears, check the repo's
# Actions secrets before debugging anything else — the token needs Workers
# Scripts: Edit + D1: Edit. Worker deploys queue up silently while broken, so
# also re-check that pending D1 migrations applied after recovery.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  # Lets you trigger a deploy manually from any branch (Actions tab → Run workflow).
  # Useful when a fix has landed on a feature branch and you want it live
  # before the branch is merged to main.
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 10 was too tight and killed deploys silently. Two `npm ci` runs plus the
    # worker suite sit around six or seven minutes and occasionally cross ten:
    # runs 158 and 160 on 2026-09-04 both died at exactly the limit, which
    # GitHub reports as "cancelled", so it reads like somebody stopped it
    # rather than like a failure worth looking at.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # vitest lives in the root package.json (npm run test:worker runs
      # worker/tests). A failing auth/fulfillment test blocks the deploy.
      - name: Install root dependencies
        run: npm ci

      - name: Worker tests
        run: npm run test:worker

      # Build the worker before touching the database.
      #
      # vitest only transpiles the files a test actually imports, so nothing in
      # the suite has an opinion about a module no test loads. On 2026-09-06 a
      # renamed export left `curateImports.ts` importing a name that no longer
      # existed: 1198 tests passed, migration 0009 applied to the live database,
      # and the deploy then died in esbuild. The schema was ahead of the code
      # for as long as the fix took.
      #
      # `--dry-run` runs the same bundle the deploy runs and writes nothing
      # anywhere, so it costs seconds and needs no credentials. It sits above
      # the migration step deliberately: a bundle that cannot build must stop
      # the run before the database moves.
      - name: Build worker (dry run)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker-build

      # (The one-off 097 tracker reconcile was removed 2026-07-11: migration 097
      # is now applied and recorded in d1_migrations, so the redundant ALTERs only
      # logged "duplicate column" noise on every deploy.)

      # Migrations apply on every worker deploy. This step must NOT swallow
      # failures: a silent `continue-on-error` is what let 076 + 080 drift out
      # of prod undetected (the d1_migrations tracker fell out of sync while the
      # deploy reported success). Tracker was reconciled 2026-06-01; from here a
      # failed migration fails the deploy loudly so drift can't recur.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply teajia-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
