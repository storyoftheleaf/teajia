name: Deploy worker

# This deploys the worker (the API at teajia-api.lightcodes.workers.dev) on
# every push that touches worker/**, plus on demand from the Actions tab.
# Pages independently auto-deploys main to teajiafinal. A coordinated release
# dispatches this workflow at an immutable candidate tag; only verified Worker
# bytes authorize the runner to advance main and observe the Pages release.
#
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — Edit Workers permission, scoped to the account
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns teajia-api
#
# 2026-08-19: CLOUDFLARE_API_TOKEN went missing around Aug 8 and every deploy
# from then until Aug 11 failed at the wrangler step with "it's necessary to
# set a CLOUDFLARE_API_TOKEN environment variable" (tests all green, deploy
# never reached Cloudflare). If that error ever reappears, check the repo's
# Actions secrets before debugging anything else — the token needs Workers
# Scripts: Edit + D1: Edit. Worker deploys queue up silently while broken, so
# also re-check that pending D1 migrations applied after recovery.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - 'scripts/verify-worker-release*'
      - 'scripts/publish-verified-release*'
      - 'scripts/observe-verified-release*'
  # Lets you trigger a deploy manually from any branch (Actions tab → Run workflow).
  # Useful when a fix has landed on a feature branch and you want it live
  # before the branch is merged to main.
  workflow_dispatch:
    inputs:
      publish_main_expected:
        description: 'Expected current main SHA; empty deploys only the Worker'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 10 was too tight and killed deploys silently. Two `npm ci` runs plus the
    # worker suite sit around six or seven minutes and occasionally cross ten:
    # runs 158 and 160 on 2026-09-04 both died at exactly the limit, which
    # GitHub reports as "cancelled", so it reads like somebody stopped it
    # rather than like a failure worth looking at.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Persist coordinated release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.publish_main_expected }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_STATE_PATH: ${{ runner.temp }}/release-state.json
        run: node scripts/publish-verified-release.mjs --initialize

      - name: Save initial release state
        if: github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error

      - name: Preflight coordinated publication access
        if: github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.publish_main_expected }}
          CANDIDATE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_STATE_PATH: ${{ runner.temp }}/release-state.json
        run: node scripts/publish-verified-release.mjs --preflight

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # vitest lives in the root package.json (npm run test:worker runs
      # worker/tests). A failing auth/fulfillment test blocks the deploy.
      - name: Install root dependencies
        run: npm ci

      - name: Worker proof observer tests
        run: node --test scripts/verify-worker-release.test.mjs

      - name: Coordinated publication observer tests
        if: github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        run: node --test scripts/publish-verified-release.test.mjs scripts/observe-verified-release.test.mjs

      - name: Worker tests
        run: npm run test:worker

      # Build the worker before touching the database.
      #
      # vitest only transpiles the files a test actually imports, so nothing in
      # the suite has an opinion about a module no test loads. On 2026-09-06 a
      # renamed export left `curateImports.ts` importing a name that no longer
      # existed: 1198 tests passed, migration 0009 applied to the live database,
      # and the deploy then died in esbuild. The schema was ahead of the code
      # for as long as the fix took.
      #
      # `--dry-run` runs the same bundle the deploy runs and writes nothing
      # anywhere, so it costs seconds and needs no credentials. It sits above
      # the migration step deliberately: a bundle that cannot build must stop
      # the run before the database moves.
      - name: Build worker (dry run)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker-build

      # (The one-off 097 tracker reconcile was removed 2026-07-11: migration 097
      # is now applied and recorded in d1_migrations, so the redundant ALTERs only
      # logged "duplicate column" noise on every deploy.)

      # Migrations apply on every worker deploy. This step must NOT swallow
      # failures: a silent `continue-on-error` is what let 076 + 080 drift out
      # of prod undetected (the d1_migrations tracker fell out of sync while the
      # deploy reported success). Tracker was reconciled 2026-06-01; from here a
      # failed migration fails the deploy loudly so drift can't recur.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply teajia-db --remote

      # --var adds the revision binding to the existing config bindings; it
      # does not replace [vars] or stored secrets. Wrangler is lockfile-pinned.
      - name: Deploy to Cloudflare Workers
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx wrangler deploy --var "RELEASE_GIT_SHA:$CANDIDATE_SHA" | tee "$RUNNER_TEMP/worker-deploy.log"

      - name: Prove exact Worker revision and runtime version
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          WORKER_DEPLOY_LOG: ${{ runner.temp }}/worker-deploy.log
          WORKER_PROOF_PATH: ${{ runner.temp }}/worker-release-proof.json
        run: node scripts/verify-worker-release.mjs

      - name: Save Worker proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-release-proof
          path: |
            ${{ runner.temp }}/worker-release-proof.json
            ${{ runner.temp }}/worker-deploy.log
          if-no-files-found: warn

      - name: Observe main publication and prove Pages bytes
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.publish_main_expected }}
          CANDIDATE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_STATE_PATH: ${{ runner.temp }}/release-state.json
          WORKER_PROOF_PATH: ${{ runner.temp }}/worker-release-proof.json
        run: node scripts/publish-verified-release.mjs

      - name: Record coordinated release failure
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.publish_main_expected }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_STATE_PATH: ${{ runner.temp }}/release-state.json
        run: node scripts/publish-verified-release.mjs --failed

      - name: Save coordinated release result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_main_expected != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-result
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: warn
