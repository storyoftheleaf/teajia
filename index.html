<html lang="en">
  <head>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts: Load critical fonts first, defer others -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@200;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Bricolage+Grotesque:wght@200;300;400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/styles/card-utilities.css">
    <style>
      :root {
        /* Brand Colors */
        --color-tea-seal: #b8882d;
        --color-tea-seal-dark: #a07830;

        /* Font Families - Customizable by FontThemeTester */
        --font-serif: 'Lora', 'Noto Serif SC', serif;
        --font-sans: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', 'Menlo', 'Courier New', monospace;

        /* Font Sizes - Customizable by FontThemeTester */
        --font-size-xs: 0.75rem;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        --font-size-2xl: 1.5rem;
        --font-size-3xl: 1.875rem;
        --font-size-4xl: 2.25rem;
        --font-size-5xl: 3rem;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'tea-charcoal': '#1a1a1a',
              'tea-paper': '#F3F0E7',
              'tea-paper-dark': '#E6E2D6',
              'tea-beige': '#D8D0C0',
              'tea-beige-dark': '#8A8070',
              'tea-ink': '#2C2C2C',
              'tea-ink-light': '#555555',
              'tea-ink-secondary': '#555555',
              'tea-paper-secondary': '#B8B4AA',
              'tea-seal': '#b8882d',
              'tea-seal-dark': '#a07830',
              'tea-green': '#5A6E5A',
              'tea-moss': '#2A3430',
              'tea-shadow': 'rgba(0,0,0,0.15)',
              // Admin (dark theme) tokens
              'tea-bg': '#0c0c0c',
              'tea-surface': '#121212',
              'tea-border': '#262626',
              'tea-text': '#e5e5e5',
              'tea-muted': '#737373',
              'tea-accent': '#b8882d',
            },
            fontFamily: {
              serif: ['Lora', 'Noto Serif SC', 'serif'],
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'Menlo', 'Courier New', 'monospace'],
            },
            fontSize: {
              xs: '0.75rem',
              sm: '0.875rem',
              base: '1rem',
              lg: '1.125rem',
              xl: '1.25rem',
              '2xl': '1.5rem',
              '3xl': '1.875rem',
              '4xl': '2.25rem',
              '5xl': '3rem',
            },
            fontWeight: {
              light: 300,
              normal: 400,
              medium: 500,
              semibold: 600,
              bold: 700,
            },
            spacing: {
              xs: '0.25rem',
              sm: '0.5rem',
              md: '1rem',
              lg: '1.5rem',
              xl: '2rem',
              '2xl': '3rem',
              '3xl': '4rem',
            },
            boxShadow: {
              sm: '0 1px 2px 0 rgb(0 0 0 / 0.05)',
              base: '0 1px 3px rgba(0,0,0,0.3)',
              md: '0 4px 6px -1px rgb(0 0 0 / 0.1)',
              lg: '0 8px 20px rgba(0,0,0,0.4)',
              xl: '0 20px 25px -5px rgb(0 0 0 / 0.1)',
            },
            borderRadius: {
              none: '0px',
              sm: '0.125rem',
              base: '0.25rem',
              md: '0.375rem',
              lg: '0.5rem',
              xl: '0.75rem',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              slideIn: {
                '0%': { transform: 'scaleX(0)', transformOrigin: 'left' },
                '100%': { transform: 'scaleX(1)', transformOrigin: 'left' },
              },
              slideInWidth: {
                '0%': { width: '0' },
                '100%': { width: '100%' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-out',
              slideIn: 'slideIn 0.3s ease-out',
              slideInWidth: 'slideInWidth 0.3s ease-out',
              slideUp: 'slideUp 0.4s ease-out',
              scaleIn: 'scaleIn 0.2s ease-out',
              shimmer: 'shimmer 1.5s infinite',
            },
            backgroundImage: {
              'paper-texture': "repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(180, 165, 140, 0.03) 1px, rgba(180, 165, 140, 0.03) 2px), repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(180, 165, 140, 0.02) 2px, rgba(180, 165, 140, 0.02) 3px)",
            },
          },
        },
      };
    </script>
    <style>
      /* Alcove card fonts & styles */
      @font-face {
        font-family: 'Fraunces Fallback';
        src: local('Georgia');
        size-adjust: 105%;
        ascent-override: 95%;
        descent-override: 22%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Bricolage Fallback';
        src: local('Arial');
        size-adjust: 100%;
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
      }
      .tea-card-scroll::-webkit-scrollbar { width: 3px; }
      .tea-card-scroll::-webkit-scrollbar-track { background: transparent; }
      .tea-card-scroll::-webkit-scrollbar-thumb { background: rgba(200,170,120,0.15); border-radius: 2px; }
      @keyframes panelReveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Custom scrollbar for reader */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Base Typography for Better Readability */
      body {
        line-height: 1.625;
        letter-spacing: 0.01em;
      }

      p {
        line-height: 1.7;
      }

      /* Texture Overlay Class */
      .texture-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .grain-texture {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='5' stitchTiles='stitch' seed='2'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .fabric-texture {
        background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px),
                          repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px);
      }

      /* Vertical Text Utility */
      .writing-vertical {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }

      /* Enhanced Typography for Articles */
      .article-h2 {
        position: relative;
        padding-bottom: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .article-h2::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 3rem;
        height: 2px;
        background-color: var(--color-tea-seal);
        transition: width 0.3s ease-out;
      }

      .article-h2:hover::after {
        width: 5rem;
      }

      /* Drop Cap styling */
      .drop-cap::first-letter {
        font-size: 2.5em;
        font-weight: 700;
        float: left;
        margin-right: 0.1em;
        line-height: 1;
        color: var(--color-tea-seal);
      }

      /* Pull Quote styling */
      .pull-quote {
        border-left: 4px solid var(--color-tea-seal);
        padding-left: 1.5rem;
        margin: 2rem 0;
        font-style: italic;
        color: #555555;
      }

      /* Side Note styling */
      .side-note {
        background-color: rgba(244, 240, 230, 0.5);
        border-left: 2px solid var(--color-tea-seal);
        padding: 1rem;
        margin: 1.5rem 0;
        font-size: 0.9rem;
        color: #555555;
      }

      .dark .side-note {
        background-color: rgba(60, 60, 60, 0.5);
      }

      /* Article body enhanced */
      .article-body {
        line-height: 1.85;
        letter-spacing: 0.2px;
      }

      .article-body p {
        margin-bottom: 1.5rem;
      }

      .article-section-break {
        height: 1px;
        background-color: rgba(44, 44, 44, 0.3);
        margin: 3rem 0;
      }

      .dark .article-section-break {
        background-color: rgba(255, 255, 255, 0.1);
      }

      /* Print styles */
      @media print {
        .texture-overlay,
        .wood-texture,
        nav,
        .no-scrollbar,
        button { display: none !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; margin: 0 !important; }
      }

      /* Accessibility: Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Focus visible styles for keyboard navigation */
      :focus-visible {
        outline: 2px solid var(--color-tea-seal);
        outline-offset: 2px;
      }
    </style>
</head>
  <body class="bg-tea-charcoal text-tea-paper font-serif" style="scrollbar-gutter: stable;">
    <!-- Skip to main content link for keyboard/screen reader users -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[9999] focus:bg-tea-seal focus:text-white focus:px-4 focus:py-2 focus:rounded-sm focus:text-sm focus:font-sans focus:tracking-wide focus:shadow-lg">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
