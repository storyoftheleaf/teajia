<html lang="en">
  <head>

    <!-- Fonts: Vollkorn (display), Lora (body), Inter (UI), JetBrains Mono (technical), Chinese -->

    <link rel="stylesheet" href="/styles/card-utilities.css">
    <style>
      /* Espresso + Gold — Dark mode (default) */
      :root {
        --tea-bg: #18130e;
        --tea-surface: #28211a;
        --tea-elevated: #3a3126;
        --tea-text: #ede4d4;
        --tea-text-sec: #b5a892;
        --tea-text-dim: #80735f;
        --tea-gold: #b8924e;
        --tea-gold-lt: #d4ac66;
        --tea-border: rgba(184,146,78,0.08);
        --tea-accent-sub: rgba(184,146,78,0.1);

        /* Font Families */
        --font-display: 'Vollkorn', 'Lora', 'Noto Serif SC', Georgia, serif;
        --font-serif: 'Lora', 'Noto Serif SC', serif;
        --font-body: 'Lora', 'Noto Serif SC', serif;
        --font-sans: 'Inter', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', 'Menlo', 'Courier New', monospace;

        /* Legacy aliases (for CSS that still uses old names) */
        --color-tea-seal: var(--tea-gold);
        --color-tea-seal-dark: var(--tea-gold);
      }

      /* Light mode */
      :root.light, .light {
        --tea-bg: #f4ece0;
        --tea-surface: #e6dbcc;
        --tea-elevated: #d5c8b4;
        --tea-text: #18130e;
        --tea-text-sec: #5e5342;
        --tea-text-dim: #9a8c78;
        --tea-gold: #8e6d2e;
        --tea-gold-lt: #a88340;
        --tea-border: rgba(142,109,46,0.1);
        --tea-accent-sub: rgba(142,109,46,0.07);
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // CSS variable-driven tokens (switch with dark/light mode)
              'tea-bg': 'var(--tea-bg)',
              'tea-surface': 'var(--tea-surface)',
              'tea-elevated': 'var(--tea-elevated)',
              'tea-text': 'var(--tea-text)',
              'tea-text-sec': 'var(--tea-text-sec)',
              'tea-text-dim': 'var(--tea-text-dim)',
              'tea-gold': 'var(--tea-gold)',
              'tea-gold-lt': 'var(--tea-gold-lt)',
              'tea-border': 'var(--tea-border)',
              'tea-accent-sub': 'var(--tea-accent-sub)',
              // Legacy aliases (kept during migration, will be removed)
              'tea-charcoal': 'var(--tea-bg)',
              'tea-paper': '#ede4d4',
              'tea-paper-dark': 'var(--tea-surface)',
              'tea-beige': 'var(--tea-elevated)',
              'tea-ink': 'var(--tea-text)',
              'tea-ink-light': 'var(--tea-text-sec)',
              'tea-ink-secondary': 'var(--tea-text-sec)',
              'tea-paper-secondary': 'var(--tea-text-dim)',
              'tea-seal': 'var(--tea-gold)',
              'tea-seal-dark': 'var(--tea-gold)',
              'tea-accent': 'var(--tea-gold)',
              'tea-muted': 'var(--tea-text-dim)',
              'tea-beige-dark': 'var(--tea-text-dim)',
              'tea-green': '#5A6E5A',
              'tea-moss': '#2A3430',
              'tea-shadow': 'rgba(0,0,0,0.15)',
            },
            fontFamily: {
              display: ['Vollkorn', 'Lora', 'Noto Serif SC', 'Georgia', 'serif'],
              serif: ['Lora', 'Noto Serif SC', 'serif'],
              body: ['Lora', 'Noto Serif SC', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'Menlo', 'Courier New', 'monospace'],
            },
            fontSize: {
              xs: '0.75rem',
              sm: '0.875rem',
              base: '1rem',
              lg: '1.125rem',
              xl: '1.25rem',
              '2xl': '1.5rem',
              '3xl': '1.875rem',
              '4xl': '2.25rem',
              '5xl': '3rem',
            },
            fontWeight: {
              light: 300,
              normal: 400,
              medium: 500,
              semibold: 600,
              bold: 700,
            },
            spacing: {
              xs: '0.25rem',
              sm: '0.5rem',
              md: '1rem',
              lg: '1.5rem',
              xl: '2rem',
              '2xl': '3rem',
              '3xl': '4rem',
            },
            boxShadow: {
              sm: '0 1px 2px 0 rgb(0 0 0 / 0.05)',
              base: '0 1px 3px rgba(0,0,0,0.3)',
              md: '0 4px 6px -1px rgb(0 0 0 / 0.1)',
              lg: '0 8px 20px rgba(0,0,0,0.4)',
              xl: '0 20px 25px -5px rgb(0 0 0 / 0.1)',
            },
            borderRadius: {
              none: '0px',
              sm: '0.125rem',
              base: '0.25rem',
              md: '0.375rem',
              lg: '0.5rem',
              xl: '0.75rem',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              slideIn: {
                '0%': { transform: 'scaleX(0)', transformOrigin: 'left' },
                '100%': { transform: 'scaleX(1)', transformOrigin: 'left' },
              },
              slideInWidth: {
                '0%': { width: '0' },
                '100%': { width: '100%' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-out',
              slideIn: 'slideIn 0.3s ease-out',
              slideInWidth: 'slideInWidth 0.3s ease-out',
              slideUp: 'slideUp 0.4s ease-out',
              scaleIn: 'scaleIn 0.2s ease-out',
              shimmer: 'shimmer 1.5s infinite',
            },
            backgroundImage: {
              'paper-texture': "repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(180, 165, 140, 0.03) 1px, rgba(180, 165, 140, 0.03) 2px), repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(180, 165, 140, 0.02) 2px, rgba(180, 165, 140, 0.02) 3px)",
            },
          },
        },
      };
    </script>
    <style>
      /* Card & Alcove styles */
      .tea-card-scroll::-webkit-scrollbar { width: 3px; }
      .tea-card-scroll::-webkit-scrollbar-track { background: transparent; }
      .tea-card-scroll::-webkit-scrollbar-thumb { background: rgba(200,170,120,0.15); border-radius: 2px; }
      @keyframes panelReveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Custom scrollbar for reader */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Base Typography — Inter for UI, Lora for reading */
      body {
        font-family: var(--font-sans);
        font-weight: 300;
        line-height: 1.5;
        letter-spacing: 0.01em;
        transition: background-color 0.6s ease, color 0.6s ease;
      }

      p {
        line-height: 1.7;
      }

      /* Texture Overlay Class */
      .texture-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .grain-texture {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='5' stitchTiles='stitch' seed='2'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .fabric-texture {
        background-image: repeating-linear-gradient(90deg, rgba(200,170,120,0.03) 0px, rgba(200,170,120,0.03) 1px, transparent 1px, transparent 4px),
                          repeating-linear-gradient(0deg, rgba(200,170,120,0.03) 0px, rgba(200,170,120,0.03) 1px, transparent 1px, transparent 4px);
      }

      /* Vertical Text Utility */
      .writing-vertical {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }

      /* Enhanced Typography for Articles */
      .article-h2 {
        position: relative;
        padding-bottom: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .article-h2::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 3rem;
        height: 2px;
        background-color: var(--tea-gold);
        transition: width 0.3s ease-out;
      }

      .article-h2:hover::after {
        width: 5rem;
      }

      /* Drop Cap styling */
      .drop-cap::first-letter {
        font-size: 2.5em;
        font-weight: 700;
        float: left;
        margin-right: 0.1em;
        line-height: 1;
        color: var(--tea-gold);
      }

      /* Pull Quote styling */
      .pull-quote {
        border-left: 3px solid var(--tea-gold);
        padding: 1.5rem 1.5rem 1.5rem 2rem;
        margin: 2rem 0;
        font-style: italic;
        color: var(--tea-text-sec);
        background: linear-gradient(90deg, rgba(184, 146, 78, 0.04) 0%, transparent 80%);
      }

      /* Side Note styling */
      .side-note {
        background-color: var(--tea-accent-sub);
        border-left: 2px solid var(--tea-gold);
        padding: 1rem;
        margin: 1.5rem 0;
        font-size: 0.9rem;
        color: var(--tea-text-sec);
      }

      /* Article body enhanced */
      .article-body {
        line-height: 1.85;
        letter-spacing: 0.2px;
      }

      .article-body p {
        margin-bottom: 1.5rem;
      }

      .article-section-break {
        height: 1px;
        background-color: var(--tea-border);
        margin: 3rem 0;
      }

      /* Print styles */
      @media print {
        .texture-overlay,
        .wood-texture,
        nav,
        .no-scrollbar,
        button { display: none !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; margin: 0 !important; }
      }

      /* Accessibility: Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Focus visible styles for keyboard navigation */
      :focus-visible {
        outline: 2px solid var(--tea-gold);
        outline-offset: 2px;
      }
    </style>
</head>
  <body class="bg-tea-bg text-tea-text font-sans" style="scrollbar-gutter: stable; -webkit-font-smoothing: antialiased;">

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
