<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Teajia | Tea Journal</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- SEO & Social -->
    <meta name="description" content="Teajia is an editorial journal for the world of tea — articles, visual stories, a curated shop, courses, and space design services." />
    <link rel="canonical" href="https://teajia.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Teajia" />
    <meta property="og:title" content="Teajia | Tea Journal" />
    <meta property="og:description" content="An editorial journal for the world of tea — articles, visual stories, a curated shop, courses, and space design services." />
    <meta property="og:image" content="https://teajia.com/og-image.png" />
    <meta property="og:url" content="https://teajia.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Teajia | Tea Journal" />
    <meta name="twitter:description" content="An editorial journal for the world of tea — articles, visual stories, a curated shop, courses, and space design services." />
    <meta name="twitter:image" content="https://teajia.com/og-image.png" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#18130e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Service worker: add /sw.js for offline support -->
    <!-- Critical CSS: prevent flash of unstyled content -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background-color: #18130e;
        color: #e8dfd4;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100dvh; }
    </style>
    <!-- Fonts: preconnect hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://teajia-api.lightcodes.workers.dev" crossorigin>
    <!-- Critical fonts: Cormorant Garamond (display), Lora (body), Plus Jakarta Sans (UI/captions), Noto Serif SC (Chinese), IBM Plex Mono (data) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@200;400;700&display=swap">
    <!-- Deferred fonts: calligraphy (decorative, not critical path) -->
    <script>
      (function() {
        function loadDeferredFonts() {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap';
          document.head.appendChild(link);
        }
        if (document.readyState === 'complete') {
          loadDeferredFonts();
        } else {
          window.addEventListener('load', loadDeferredFonts);
        }
      })();
    </script>
</head>
  <body class="bg-tea-bg text-tea-text font-sans" style="scrollbar-gutter: stable; -webkit-font-smoothing: antialiased;">
    <!-- Skip to main content link for keyboard/screen reader users -->
    <a href="#main-content" class="fixed -top-full left-4 z-[9999] focus:top-4 bg-tea-gold text-white px-4 py-2 rounded-sm text-sm font-sans tracking-wide shadow-lg transition-[top] duration-150">Skip to content</a>
    <div id="root">
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#18130e;color:#b5a892;font-family:Georgia,serif;font-size:14px;">Loading Teajia…</div>
    </div>
    <script>
      // Catch module loading errors and display them
      window.addEventListener('error', function(e) {
        var el = document.getElementById('app-loading');
        if (el) el.innerHTML = '<div style="text-align:center;padding:2rem;"><p style="color:#e8c170;margin-bottom:8px;">Failed to load</p><p style="font-size:12px;opacity:0.6;">' + (e.message || 'Unknown error') + '</p></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('app-loading');
        if (el) el.innerHTML = '<div style="text-align:center;padding:2rem;"><p style="color:#e8c170;margin-bottom:8px;">Failed to load</p><p style="font-size:12px;opacity:0.6;">' + (e.reason?.message || e.reason || 'Module load error') + '</p></div>';
      });
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
